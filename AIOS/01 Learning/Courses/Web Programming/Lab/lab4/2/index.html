<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="styles.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <title>Lab4.2</title>
</head>
<body>
    <div class="translate">
        <p id="ptranslate">Language</p>
        <select class="dropdown" id="langSelect" onchange="setLanguage()">
            <option value="en">English</option>
            <option value="th">ไทย</option>
        </select>
    </div>
    <div class ="main-container">
        <h2 id="head">User Registration</h2>
        <form id="loginform">
        <label for="uname" id="username">Username:</label><br>
        <input type="text" id="uname" name="uname"><br>
        <label for="email" id="Email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="e.g., User@example.com"><br>
        <label for="Phone" id="phonenum">Phone Number:</label><br>
        <input type="text" id="phone" name="phone" placeholder="e.g., 5555555555"><br>
        <label for="Password" id="pass">Password:</label><br>
        <input type="password" id="password" name="password" value=""><br>
        <label for="ConfirmPassword" id="cpass">Confirm Password:</label><br>
        <input type="password" id="cpassword" name="cpassword" value=""><br>
        <button type="submit" value="Register" id="register">Register</button>
        </form> 
    </div>
    <script src="script.js"></script>
</body>
</html>
